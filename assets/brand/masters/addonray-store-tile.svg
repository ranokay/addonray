<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" role="img" aria-labelledby="title">
  <title id="title">AddonRay reusable store tile</title>
  <!-- Reusable dark composition. This is not a store submission asset. -->
  <rect width="300" height="300" rx="64" fill="#0c1711"/>
  <g transform="translate(28 28) scale(2.4)" id="aperture-mark">
    <path id="aperture-ring" d="M27.4 16A11.4 11.4 0 1 1 16 4.6" fill="none" stroke="#2f8f63" stroke-width="3.6" stroke-linecap="round"/>
    <circle id="aperture-dot" cx="16" cy="16" r="4.2" fill="#2f8f63"/>
    <circle id="aperture-dot-accent" cx="16" cy="16" r="2.2" fill="#b6e4ca"/>
  </g>
  <text x="30" y="236" fill="#f1f1f1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="650" letter-spacing="-1.8">AddonRay</text>
  <text x="32" y="264" fill="#8fb8a3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" letter-spacing="0.2">Extension inspector</text>
</svg>
