<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 320 80" role="img" aria-labelledby="title">
  <title id="title">AddonRay lockup</title>
  <!-- Horizontal lockup for light or neutral surfaces. The wordmark uses the product UI stack. -->
  <g transform="translate(4 8) scale(2)" id="aperture-mark">
    <path id="aperture-ring" d="M27.4 16A11.4 11.4 0 1 1 16 4.6" fill="none" stroke="#2f8f63" stroke-width="3.6" stroke-linecap="round"/>
    <circle id="aperture-dot" cx="16" cy="16" r="4.2" fill="#2f8f63"/>
    <circle id="aperture-dot-accent" cx="16" cy="16" r="2.2" fill="#b6e4ca"/>
  </g>
  <text x="82" y="53" fill="#0b3a28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="650" letter-spacing="-1.9">AddonRay</text>
</svg>
