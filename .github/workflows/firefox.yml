name: Firefox qualification
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  firefox:
    name: ${{ matrix.os }} / Firefox ${{ matrix.firefox }} / unsigned XPI
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-24.04, windows-2025]
        firefox: ['140.0', '153.5.1esr', '158.0.1']
    env:
      FIREFOX_VERSION: ${{ matrix.firefox }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: http:bun
      - name: Install Firefox system dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-glib-1-2
      - run: bun install --frozen-lockfile
      - run: bun run check:toolchain
      - run: bun run package
      - run: bun scripts/check-source-build.mjs
      - run: bun scripts/firefox-probes.mjs --package
      - name: Preserve qualification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firefox-${{ runner.os }}-${{ matrix.firefox }}
          path: |
            .scratch/firefox-evidence-*-xpi.json
            .scratch/source-build-evidence.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
