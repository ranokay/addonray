<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AddonRay brand directions</title>
    <style>
      :root {
        color-scheme: light dark;
        font-synthesis: none;
        --brand-shell-max: 1120px;
        --brand-chrome-line: color-mix(in srgb, currentColor 16%, transparent);
        --brand-chrome-muted: color-mix(in srgb, currentColor 64%, transparent);
        --brand-chrome-faint: color-mix(in srgb, currentColor 46%, transparent);
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
      }

      body {
        color: inherit;
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      .brand-shell {
        width: 100%;
        max-width: var(--brand-shell-max);
        margin: 0 auto;
        padding: 0 0 148px;
      }

      .brand-variant-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 28px;
        margin-bottom: 18px;
        padding: 30px 0 18px;
        border-bottom: 1px solid var(--brand-chrome-line);
      }

      .brand-title-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
      }

      .brand-variant-head h2 {
        margin: 0;
        font-size: 32px;
        font-weight: 650;
        letter-spacing: -0.045em;
      }

      .brand-axis {
        border: 1px solid var(--brand-chrome-line);
        border-radius: 999px;
        padding: 4px 9px;
        color: var(--brand-chrome-muted);
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .brand-variant-note {
        max-width: 64ch;
        margin: 8px 0 0;
        color: var(--brand-chrome-muted);
        font-size: 14px;
      }

      .brand-tradeoff {
        max-width: 33ch;
        margin: 0;
        color: var(--brand-chrome-muted);
        font-size: 12px;
        text-align: right;
      }

      .brand-tradeoff strong {
        color: inherit;
        font-weight: 600;
      }

      .brand-contexts {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .brand-demo {
        min-width: 0;
        margin: 0;
        padding: 12px;
        border: 1px solid var(--brand-chrome-line);
        border-radius: 14px;
      }

      .brand-demo--wide {
        grid-column: 1 / -1;
      }

      .brand-demo figcaption {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 14px;
        margin: 0 2px 10px;
        font-size: 11px;
        letter-spacing: 0.02em;
      }

      .brand-demo figcaption strong {
        font-weight: 600;
      }

      .brand-demo figcaption span {
        color: var(--brand-chrome-muted);
        text-align: right;
      }

      .brand-canvas {
        overflow: hidden;
        border-radius: 10px;
      }

      .brand-canvas--light {
        --mark-ink: #0b3a28;
        --mark-accent: #1f7a52;
        color: #17211c;
        background: #f5f6f3;
      }

      .brand-canvas--dark {
        --mark-ink: #b6e4ca;
        --mark-accent: #6fc79b;
        color: #f1f1f1;
        background: #080808;
      }

      .brand-canvas--toolbars {
        display: grid;
        gap: 10px;
        padding: 14px;
        background: #dfe1da;
      }

      .mark {
        display: block;
        width: var(--size);
        height: var(--size);
        flex: none;
      }

      .brand-toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 44px;
        padding: 0 12px;
        border-radius: 9px;
      }

      .brand-toolbar--dark {
        --mark-ink: #b6e4ca;
        --mark-accent: #6fc79b;
        color: #d7d7dd;
        background: #1c1b22;
      }

      .brand-toolbar--light {
        --mark-ink: #0b3a28;
        --mark-accent: #1f7a52;
        color: #4a4a52;
        border: 1px solid #e4e4e8;
        background: #f9f9fb;
      }

      .brand-tb-nav {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 16px;
        line-height: 1;
        opacity: 0.62;
      }

      .brand-tb-address {
        display: flex;
        flex: 1;
        align-items: center;
        gap: 7px;
        min-width: 0;
        height: 26px;
        padding: 0 11px;
        border-radius: 999px;
        background: color-mix(in srgb, currentColor 10%, transparent);
        font-size: 11px;
        white-space: nowrap;
      }

      .brand-tb-address span:last-child {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .brand-tb-lock {
        width: 8px;
        height: 8px;
        border: 1.5px solid currentColor;
        border-radius: 50%;
        opacity: 0.55;
      }

      .brand-tb-tools {
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .brand-tb-glyph {
        width: 16px;
        height: 16px;
        opacity: 0.42;
      }

      .brand-tb-glyph--ring {
        border: 1.5px solid currentColor;
        border-radius: 50%;
      }

      .brand-tb-glyph--square {
        border: 1.5px solid currentColor;
        border-radius: 3px;
      }

      .brand-tb-mark {
        display: grid;
        width: 26px;
        height: 26px;
        place-items: center;
        border-radius: 6px;
        background: color-mix(in srgb, currentColor 9%, transparent);
      }

      .brand-scale-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 10px;
      }

      .brand-scale-cell {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 14px;
        border-radius: 9px;
      }

      .brand-scale-cell--dark {
        --mark-ink: #b6e4ca;
        --mark-accent: #6fc79b;
        color: #d7d7dd;
        background: #1c1b22;
      }

      .brand-scale-cell--light {
        --mark-ink: #0b3a28;
        --mark-accent: #1f7a52;
        color: #4a4a52;
        border: 1px solid #e4e4e8;
        background: #f9f9fb;
      }

      .brand-scale-label {
        margin-left: auto;
        font-size: 11px;
        opacity: 0.72;
      }

      .brand-manage-list {
        display: grid;
        gap: 10px;
        padding: 16px;
      }

      .brand-manage {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px;
        border-radius: 12px;
      }

      .brand-canvas--light .brand-manage {
        border: 1px solid #e2e5df;
        background: #ffffff;
      }

      .brand-canvas--dark .brand-manage {
        border: 1px solid #2c2c2c;
        background: #121212;
      }

      .brand-manage--muted {
        opacity: 0.55;
      }

      .brand-manage-icon {
        display: grid;
        flex: none;
        width: 56px;
        height: 56px;
        place-items: center;
        border-radius: 12px;
        background: color-mix(in srgb, currentColor 8%, transparent);
      }

      .brand-manage-icon--generic::before {
        width: 20px;
        height: 20px;
        border: 2px solid currentColor;
        border-radius: 5px;
        content: '';
        opacity: 0.45;
      }

      .brand-manage-copy {
        min-width: 0;
      }

      .brand-manage-copy strong {
        display: block;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .brand-manage-meta {
        font-size: 11px;
        opacity: 0.62;
      }

      .brand-manage-copy p {
        max-width: 38ch;
        margin: 2px 0 0;
        font-size: 12px;
        line-height: 1.4;
        opacity: 0.68;
      }

      .brand-toggle {
        position: relative;
        flex: none;
        width: 34px;
        height: 20px;
        margin-left: auto;
        border-radius: 999px;
        background: #2f7d59;
      }

      .brand-toggle::after {
        position: absolute;
        top: 3px;
        right: 3px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #ffffff;
        content: '';
      }

      .brand-toggle--off {
        background: color-mix(in srgb, currentColor 22%, transparent);
      }

      .brand-toggle--off::after {
        right: auto;
        left: 3px;
      }

      .brand-canvas--dark .brand-toggle {
        background: #b6e4ca;
      }

      .brand-canvas--dark .brand-toggle::after {
        background: #0c1711;
      }

      .brand-canvas--dark .brand-toggle--off {
        background: #3a403c;
      }

      .brand-canvas--dark .brand-toggle--off::after {
        background: #9aa39d;
      }

      .brand-asset-board {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 20px;
        padding: 18px;
      }

      .brand-asset-item {
        display: grid;
        gap: 8px;
        justify-items: center;
      }

      .brand-tile {
        display: grid;
        place-items: center;
        border-radius: 22px;
      }

      .brand-tile--128 {
        width: 128px;
        height: 128px;
      }

      .brand-canvas--light .brand-tile {
        border: 1px solid #e2e5df;
        background: #ffffff;
      }

      .brand-canvas--dark .brand-tile {
        border: 1px solid #24312a;
        background: #0f1713;
      }

      .brand-lockup {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 256px;
        height: 128px;
        padding: 0 24px;
        border-radius: 22px;
      }

      .brand-canvas--light .brand-lockup {
        border: 1px solid #e2e5df;
        background: #ffffff;
      }

      .brand-canvas--dark .brand-lockup {
        border: 1px solid #24312a;
        background: #0f1713;
      }

      .brand-wordmark {
        font-size: 26px;
        font-weight: 650;
        letter-spacing: -0.045em;
        line-height: 1;
      }

      .brand-asset-label {
        color: currentColor;
        font-size: 10px;
        letter-spacing: 0.06em;
        opacity: 0.55;
        text-transform: uppercase;
      }

      .brand-split {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .brand-split > * {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 20px;
        min-width: 0;
        padding: 22px;
      }

      .brand-split--light {
        --mark-ink: #0b3a28;
        --mark-accent: #1f7a52;
        color: #17211c;
        background: #f5f6f3;
      }

      .brand-split--dark {
        --mark-ink: #b6e4ca;
        --mark-accent: #6fc79b;
        color: #f1f1f1;
        background: #080808;
      }

      .brand-store-icon {
        display: grid;
        width: 128px;
        height: 128px;
        place-items: center;
        border-radius: 28px;
      }

      .brand-split--light .brand-store-icon {
        border: 1px solid #e2e5df;
        background: #ffffff;
      }

      .brand-split--dark .brand-store-icon {
        border: 1px solid #24312a;
        background: #0f1713;
      }

      .brand-store-tile {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 300px;
        max-width: 100%;
        aspect-ratio: 1;
        padding: 26px;
        border-radius: 36px;
      }

      .brand-split--light .brand-store-tile {
        border: 1px solid #e2e5df;
        background: #ffffff;
      }

      .brand-split--dark .brand-store-tile {
        border: 1px solid #24312a;
        background: #0f1713;
      }

      .brand-store-tile .brand-wordmark {
        display: block;
        font-size: 31px;
      }

      .brand-store-tagline {
        display: block;
        margin-top: 6px;
        font-size: 11px;
        letter-spacing: 0.01em;
        opacity: 0.6;
      }

      .brand-mono-light {
        --mark-ink: #111111;
        --mark-accent: #111111;
        color: #111111;
        background: #ffffff;
      }

      .brand-mono-dark {
        --mark-ink: #ffffff;
        --mark-accent: #ffffff;
        color: #ffffff;
        background: #111111;
      }

      .brand-mono-row {
        display: flex;
        align-items: center;
        gap: 24px;
      }

      .brand-mono-cell {
        display: grid;
        gap: 6px;
        justify-items: center;
        font-size: 10px;
        letter-spacing: 0.04em;
      }

      .brand-mono-cell > span {
        opacity: 0.62;
      }

      @media (max-width: 820px) {
        .brand-shell {
          padding: 0 0 136px;
        }

        .brand-variant-head {
          align-items: flex-start;
          flex-direction: column;
          gap: 14px;
        }

        .brand-tradeoff {
          text-align: left;
        }

        .brand-contexts {
          grid-template-columns: minmax(0, 1fr);
        }

        .brand-demo--wide {
          grid-column: auto;
        }

        .brand-scale-row {
          grid-template-columns: minmax(0, 1fr);
        }

        .brand-split {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      /* Picker styles are copied from the prototype skill's PICKER.md. */
      .proto-picker {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2147483647;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 4px;
        border-radius: 999px;
        background: rgba(10, 10, 10, 0.82);
        -webkit-backdrop-filter: blur(12px) saturate(1.4);
        backdrop-filter: blur(12px) saturate(1.4);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.08) inset,
          0 8px 24px rgba(0, 0, 0, 0.24),
          0 2px 6px rgba(0, 0, 0, 0.12);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 13px;
        line-height: 1;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
      }

      .proto-picker-highlight {
        position: absolute;
        top: 4px;
        left: 0;
        height: 28px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        will-change: transform;
      }

      .proto-picker[data-ready] .proto-picker-highlight {
        transition:
          transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
          width 250ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      @media (prefers-reduced-motion: reduce) {
        .proto-picker[data-ready] .proto-picker-highlight {
          transition: none;
        }
      }

      .proto-picker-item {
        position: relative;
        display: flex;
        align-items: center;
        height: 28px;
        padding: 0 12px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: rgba(255, 255, 255, 0.55);
        font: inherit;
        cursor: pointer;
        transition: color 150ms ease-out;
      }

      .proto-picker-item:hover {
        color: rgba(255, 255, 255, 0.85);
      }

      .proto-picker-item:active {
        transform: scale(0.97);
      }

      .proto-picker-item:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.4);
        outline-offset: 2px;
      }

      .proto-picker-item[data-active] {
        color: #fff;
      }

      .proto-picker-divider {
        width: 1px;
        height: 16px;
        margin: 0 4px;
        background: rgba(255, 255, 255, 0.12);
      }

      .proto-picker-replay {
        padding: 0 10px;
        font-size: 14px;
      }

      .proto-picker[data-position='top'] {
        bottom: auto;
        top: 24px;
      }
    </style>
  </head>
  <body>
    <main class="brand-shell" aria-label="AddonRay brand directions">
      <div id="stage"></div>
    </main>

    <nav class="proto-picker" aria-label="Prototype variants">
      <span class="proto-picker-highlight" aria-hidden="true"></span>
      <button class="proto-picker-item" data-active aria-current="true">
        Aperture
      </button>
      <button class="proto-picker-item">Prism</button>
      <button class="proto-picker-item">Frame</button>
    </nav>

    <script>
      const iconBodies = {
        aperture: `
          <path data-mark-primary d="M27.4 16A11.4 11.4 0 1 1 16 4.6" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"/>
          <circle data-mark-accent cx="16" cy="16" r="3.4" style="fill: var(--mark-accent)"/>
        `,
        prism: `
          <path data-mark-primary fill="currentColor" fill-rule="evenodd" d="M16 3.2L29 27.2A1.8 1.8 0 0 1 27.4 29.8H4.6A1.8 1.8 0 0 1 3 27.2ZM11.2 15H20.8V17.6H11.2Z"/>
          <rect data-mark-accent x="24.0" y="15.8" width="6.8" height="2.6" rx="1.3" style="fill: var(--mark-accent)"/>
        `,
        frame: `
          <path data-mark-primary d="M4.5 12V6.8A2.3 2.3 0 0 1 6.8 4.5H12M20 4.5H25.2A2.3 2.3 0 0 1 27.5 6.8V12M27.5 20V25.2A2.3 2.3 0 0 1 25.2 27.5H20M12 27.5H6.8A2.3 2.3 0 0 1 4.5 25.2V20" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
          <circle data-mark-accent cx="16" cy="16" r="3.4" style="fill: var(--mark-accent)"/>
        `,
      };

      function mark(kind, size, mono = false) {
        const style = `--size: ${size}px; color: var(--mark-ink)${mono ? '; --mark-accent: currentColor' : ''}`;
        return `<svg class="mark" viewBox="0 0 32 32" width="${size}" height="${size}" style="${style}" aria-hidden="true" focusable="false">${iconBodies[kind]}</svg>`;
      }

      function toolbar(markKind, tone, size) {
        const label = tone === 'dark' ? 'Firefox dark' : 'Chrome light';
        return `
          <div class="brand-toolbar brand-toolbar--${tone}">
            <span class="brand-tb-nav" aria-hidden="true">‹ ›</span>
            <span class="brand-tb-address"
              ><span class="brand-tb-lock" aria-hidden="true"></span
              ><span>example.test/article</span></span
            >
            <span class="brand-tb-tools" aria-hidden="true">
              <span class="brand-tb-glyph brand-tb-glyph--ring"></span>
              <span class="brand-tb-mark">${mark(markKind, size)}</span>
              <span class="brand-tb-glyph brand-tb-glyph--square"></span>
            </span>
            <span class="brand-scale-label">${label} · ${size} px</span>
          </div>
        `;
      }

      function manageList(markKind) {
        return `
          <div class="brand-manage-list">
            <div class="brand-manage">
              <span class="brand-manage-icon">${mark(markKind, 48)}</span>
              <span class="brand-manage-copy">
                <strong>AddonRay</strong>
                <span class="brand-manage-meta">0.0.1 · Enabled</span>
                <p>Inspect extension metadata and selected-page capabilities.</p>
              </span>
              <span class="brand-toggle" aria-hidden="true"></span>
            </div>
            <div class="brand-manage brand-manage--muted">
              <span class="brand-manage-icon brand-manage-icon--generic" aria-hidden="true"></span>
              <span class="brand-manage-copy">
                <strong>Reader helper</strong>
                <span class="brand-manage-meta">1.4.2 · Disabled</span>
                <p>Reads long articles in a calm layout.</p>
              </span>
              <span class="brand-toggle brand-toggle--off" aria-hidden="true"></span>
            </div>
          </div>
        `;
      }

      function assetBoard(markKind) {
        return `
          <div class="brand-asset-board">
            <div class="brand-asset-item">
              <span class="brand-tile brand-tile--128">${mark(markKind, 64)}</span>
              <span class="brand-asset-label">Companion tile · 128 px</span>
            </div>
            <div class="brand-asset-item">
              <span class="brand-lockup">
                ${mark(markKind, 48)}
                <span class="brand-wordmark">AddonRay</span>
              </span>
              <span class="brand-asset-label">Distribution lockup · 256 px</span>
            </div>
          </div>
        `;
      }

      function storeTiles(markKind) {
        return `
          <span class="brand-store-icon">${mark(markKind, 76)}</span>
          <span class="brand-store-tile">
            <span>${mark(markKind, 84)}</span>
            <span>
              <span class="brand-wordmark">AddonRay</span>
              <span class="brand-store-tagline">Extension inspector</span>
            </span>
          </span>
        `;
      }

      function silhouette(markKind) {
        return `
          <span class="brand-mono-row">
            <span class="brand-mono-cell">${mark(markKind, 16, true)}<span>16 px</span></span>
            <span class="brand-mono-cell">${mark(markKind, 32, true)}<span>32 px</span></span>
          </span>
        `;
      }

      const directions = [
        {
          name: 'Aperture',
          axis: 'Enclosed instrument',
          note: 'A broken lens ring with a focused center. The most contained shape, built from an open arc and one solid point.',
          tradeoff:
            '<strong>Wins when</strong> the product should feel precise and quiet every day. <strong>Costs</strong> the least immediate drama at store scale.',
          kind: 'aperture',
        },
        {
          name: 'Prism',
          axis: 'Angular transformation',
          note: 'A solid triangle cut by a beam, with the beam leaving the form. The most assertive shape, close to a monogram and sharply readable in a toolbar.',
          tradeoff:
            '<strong>Wins when</strong> the mark needs a confident, technical store presence. <strong>Costs</strong> softness; every edge is hard.',
          kind: 'prism',
        },
        {
          name: 'Frame',
          axis: 'Framed observation',
          note: 'A four-corner viewfinder around a solid point. The most tool-like shape, built from open brackets instead of a closed outline.',
          tradeoff:
            '<strong>Wins when</strong> the product should read as a scanning instrument. <strong>Costs</strong> warmth and adds the most structure at 16 px.',
          kind: 'frame',
        },
      ];

      function renderDirection(direction) {
        const k = direction.kind;
        return `
          <article class="brand-variant">
            <header class="brand-variant-head">
              <div>
                <div class="brand-title-row">
                  <h2>${direction.name}</h2>
                  <span class="brand-axis">${direction.axis}</span>
                </div>
                <p class="brand-variant-note">${direction.note}</p>
              </div>
              <p class="brand-tradeoff">${direction.tradeoff}</p>
            </header>

            <div class="brand-contexts">
              <figure class="brand-demo brand-demo--wide">
                <figcaption>
                  <strong>Browser toolbar</strong>
                  <span>16 px in context, 32 px high-DPI asset</span>
                </figcaption>
                <div class="brand-canvas brand-canvas--toolbars">
                  ${toolbar(k, 'dark', 16)}
                  ${toolbar(k, 'light', 16)}
                  <div class="brand-scale-row">
                    <div class="brand-scale-cell brand-scale-cell--dark">
                      ${mark(k, 32)}
                      <span class="brand-scale-label">Dark toolbar · 32 px</span>
                    </div>
                    <div class="brand-scale-cell brand-scale-cell--light">
                      ${mark(k, 32)}
                      <span class="brand-scale-label">Light toolbar · 32 px</span>
                    </div>
                  </div>
                </div>
              </figure>

              <figure class="brand-demo">
                <figcaption>
                  <strong>Extension management · light</strong>
                  <span>48 px</span>
                </figcaption>
                <div class="brand-canvas brand-canvas--light">
                  ${manageList(k)}
                </div>
              </figure>

              <figure class="brand-demo">
                <figcaption>
                  <strong>Extension management · dark</strong>
                  <span>48 px</span>
                </figcaption>
                <div class="brand-canvas brand-canvas--dark">
                  ${manageList(k)}
                </div>
              </figure>

              <figure class="brand-demo">
                <figcaption>
                  <strong>Companion and distribution · light</strong>
                  <span>Reusable sizes; identity reserved</span>
                </figcaption>
                <div class="brand-canvas brand-canvas--light">
                  ${assetBoard(k)}
                </div>
              </figure>

              <figure class="brand-demo">
                <figcaption>
                  <strong>Companion and distribution · dark</strong>
                  <span>Reusable sizes; identity reserved</span>
                </figcaption>
                <div class="brand-canvas brand-canvas--dark">
                  ${assetBoard(k)}
                </div>
              </figure>

              <figure class="brand-demo brand-demo--wide">
                <figcaption>
                  <strong>Store-scale previews</strong>
                  <span>128 px icon and 300 px tile · not submission assets</span>
                </figcaption>
                <div class="brand-canvas brand-split">
                  <div class="brand-split--light">${storeTiles(k)}</div>
                  <div class="brand-split--dark">${storeTiles(k)}</div>
                </div>
              </figure>

              <figure class="brand-demo brand-demo--wide">
                <figcaption>
                  <strong>Monochrome silhouette</strong>
                  <span>16 and 32 px, one color</span>
                </figcaption>
                <div class="brand-canvas brand-split">
                  <div class="brand-split--light brand-mono-light">${silhouette(k)}</div>
                  <div class="brand-split--dark brand-mono-dark">${silhouette(k)}</div>
                </div>
              </figure>
            </div>
          </article>
        `;
      }

      const variants = directions.map(
        (direction) => () => renderDirection(direction),
      );

      const stage = document.getElementById('stage');
      const picker = document.querySelector('.proto-picker');
      const highlight = picker.querySelector('.proto-picker-highlight');
      const items = [
        ...picker.querySelectorAll(
          '.proto-picker-item:not(.proto-picker-replay)',
        ),
      ];
      const replay = picker.querySelector('.proto-picker-replay');
      let current = 0;

      function moveHighlight() {
        const el = items[current];
        highlight.style.width = el.offsetWidth + 'px';
        highlight.style.transform = `translateX(${el.offsetLeft}px)`;
      }

      function mount(i) {
        stage.innerHTML = '';
        requestAnimationFrame(() => {
          stage.innerHTML = variants[i]();
        });
      }

      function setActive(i) {
        if (i < 0 || i >= variants.length) return;
        current = i;
        items.forEach((el, j) => {
          el.toggleAttribute('data-active', j === i);
          if (j === i) el.setAttribute('aria-current', 'true');
          else el.removeAttribute('aria-current');
        });
        moveHighlight();
        const url = new URL(location);
        url.searchParams.set('v', i + 1);
        history.replaceState(null, '', url);
        mount(i);
      }

      items.forEach((el, i) =>
        el.addEventListener('click', () => setActive(i)),
      );
      replay?.addEventListener('click', () => mount(current));
      window.addEventListener('resize', moveHighlight);

      document.addEventListener('keydown', (e) => {
        if (
          /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) ||
          e.target.isContentEditable
        )
          return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const num = parseInt(e.key, 10);
        if (num >= 1 && num <= variants.length) setActive(num - 1);
        else if (e.key === 'ArrowRight')
          setActive((current + 1) % variants.length);
        else if (e.key === 'ArrowLeft')
          setActive((current - 1 + variants.length) % variants.length);
        else if (e.key === 'r' || e.key === 'R') mount(current);
      });

      setActive(
        (parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1,
      );
      requestAnimationFrame(() =>
        requestAnimationFrame(() => picker.setAttribute('data-ready', '')),
      );
    </script>
  </body>
</html>
